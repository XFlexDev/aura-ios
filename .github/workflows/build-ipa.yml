name: Build unsigned IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Build unsigned archive
        run: |
          xcodebuild -project Aura.xcodeproj -scheme Aura -configuration Release -sdk iphoneos -archivePath "$RUNNER_TEMP/Aura.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        run: |
          rm -rf Payload Aura.ipa
          mkdir Payload
          cp -R "$RUNNER_TEMP/Aura.xcarchive/Products/Applications/Aura.app" Payload/Aura.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Aura.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Aura-unsigned-ipa
          path: Aura.ipa
          if-no-files-found: error
